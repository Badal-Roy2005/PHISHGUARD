[project]
name = "phishguard-analysis"
version = "0.1.0"
description = "PHISHGUARD orchestration API: deterministic engines, scanner isolation, risk aggregation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "tldextract>=5,<6",
    "phishguard-contracts",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.uv.sources]
phishguard-contracts = { path = "../../packages/contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
